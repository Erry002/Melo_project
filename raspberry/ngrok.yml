version: "2"
console_ui: false
web_addr: localhost:4040
region: eu
log_level: info
log_format: json

# Configurazione globale
heartbeat_interval: 1m
heartbeat_tolerance: 5s
update_check: false
metadata: "app=meluccio"

tunnels:
  web:
    addr: 3001
    proto: http
    inspect: false
    compression: true
  websocket:
    addr: 3001
    proto: http
    inspect: false
    compression: true
